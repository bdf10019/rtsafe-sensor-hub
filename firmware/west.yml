manifest:
  version: "1.2"

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: upstream
      revision: v4.4.0
      path: zephyr
      import:
        path-prefix: .deps
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_ti

  self:
    path: firmware
