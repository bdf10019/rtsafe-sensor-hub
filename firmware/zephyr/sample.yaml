sample:
  name: Deterministic Sensor and Safety Hub
  description: Multi-threaded sensor, safety, and telemetry pipeline
tests:
  sample.rtsafe.sensor_hub:
    platform_allow:
      - qemu_cortex_m3
    tags:
      - rtos
      - safety
      - telemetry
    harness: console
    harness_config:
      type: one_line
      regex:
        - "RTSAFE_READY"

